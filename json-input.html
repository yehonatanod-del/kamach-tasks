<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קמח עץ השדה — הדבק JSON</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap');

    :root {
      --bg: #ffffff;
      --surface: #f5f3ef;
      --surface2: #eceae5;
      --border: #ddd9d0;
      --accent: #b8924a;
      --accent2: #d4a85a;
      --text: #1a1814;
      --muted: #888070;
      --success: #2e7d52;
      --danger: #c0392b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      padding: 20px 16px;
    }

    #pin-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      gap: 20px;
    }

    #pin-screen.hidden { display: none; }

    #pin-screen h2 {
      color: var(--accent);
      font-size: 20px;
      font-weight: 700;
    }

    #pin-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 20px;
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      font-size: 28px;
      letter-spacing: 0.3em;
      text-align: center;
      width: 160px;
    }

    #pin-input:focus { outline: 2px solid var(--accent); }

    #pin-error {
      color: var(--danger);
      font-size: 13px;
      min-height: 18px;
    }

    #app { display: none; }
    #app.visible { display: block; }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .header p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-family: 'Heebo', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .paste-box {
      background: var(--surface);
      border: 2px dashed var(--accent);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .paste-box label {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }

    .paste-box textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
      font-family: monospace;
      font-size: 12px;
      direction: ltr;
      resize: vertical;
      min-height: 100px;
    }

    .paste-box textarea:focus { outline: 1px solid var(--accent); }

    .preview-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      display: none;
    }

    .preview-card.show { display: block; }

    .preview-row {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .preview-row .lbl {
      color: var(--muted);
      min-width: 70px;
      font-weight: 500;
    }

    .preview-row .val {
      color: var(--text);
      flex: 1;
      word-break: break-word;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 11px;
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      font-size: 13px;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { outline: 1px solid var(--accent); }

    .form-group textarea { resize: vertical; min-height: 70px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-family: 'Heebo', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover { background: var(--accent2); }
    .btn-primary:disabled { background: var(--muted); cursor: not-allowed; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.3s ease;
      z-index: 200;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error { border-color: var(--danger); color: var(--danger); }
  </style>
</head>
<body>

<div id="pin-screen">
  <h2>⚙ קמח עץ השדה</h2>
  <input type="password" id="pin-input" maxlength="4" inputmode="numeric" placeholder="••••" onkeyup="checkPin(event)">
  <div id="pin-error"></div>
</div>

<div id="app">
  <div class="header">
    <h1>⚙ קמח עץ השדה</h1>
    <p>הוסף משימה → שלח לשיטס</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('paste')">📋 הדבק JSON</button>
    <button class="tab-btn" onclick="switchTab('add')">➕ הוסף ידנית</button>
  </div>

  <!-- טב הדבק JSON -->
  <div id="paste" class="tab-content active">
    <div class="paste-box">
      <label>הדבק כאן את השורה מקלוד:</label>
      <textarea id="paste-input" placeholder='{"action":"addTask","title":"...","category":"...","priority":"..."}' oninput="parsePaste()"></textarea>
    </div>

    <div class="preview-card" id="preview-card">
      <div class="preview-row"><span class="lbl">כותרת</span><span class="val" id="pc-title">—</span></div>
      <div class="preview-row"><span class="lbl">קטגוריה</span><span class="val" id="pc-cat">—</span></div>
      <div class="preview-row"><span class="lbl">עדיפות</span><span class="val" id="pc-pri">—</span></div>
      <div class="preview-row"><span class="lbl">סוג</span><span class="val" id="pc-action">—</span></div>
    </div>

    <button class="btn-primary" id="paste-btn" onclick="submitPaste()" disabled>שלח לשיטס ✓</button>
  </div>

  <!-- טב הוסף ידנית -->
  <div id="add" class="tab-content">
    <div class="form-group">
      <label>כותרת משימה *</label>
      <input type="text" id="add-title" placeholder="תיאור המשימה">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>קטגוריה</label>
        <select id="add-category">
          <option>מכירות</option>
          <option>הורדת עלויות</option>
          <option>יבוא</option>
          <option selected>תחזוקה</option>
          <option>ניהול עובדים</option>
          <option>תזרים</option>
          <option>פרויקטים</option>
          <option>פיתוח ואסטרטגיה</option>
          <option>רכש</option>
          <option>מנכ"ל</option>
          <option>גביה</option>
          <option>כספים</option>
          <option>ארגון</option>
          <option>שת"פ</option>
          <option>אישי</option>
        </select>
      </div>

      <div class="form-group">
        <label>עדיפות</label>
        <select id="add-priority">
          <option value="היום">היום</option>
          <option value="השבוע" selected>השבוע</option>
          <option value="החודש">החודש</option>
          <option value="עתיד">עתיד</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>הערות</label>
      <textarea id="add-notes" placeholder="פרטים נוספים..."></textarea>
    </div>

    <div class="form-group">
      <label>תאריך יעד (אופציונלי)</label>
      <input type="text" id="add-dueDate" placeholder="DD/MM/YYYY">
    </div>

    <button class="btn-primary" onclick="submitAdd()">הוסף לשיטס ✓</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const CORRECT_PIN = '5213';
  const SESSION_KEY = 'kamach_json_auth';
  const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzppcqirsiZssCKtXHfU1Hc9iEEcjcnNQogS3EfNuCtPCIdb7Ln_Zw6uKrKesh-uCpWnA/exec';

  let parsedData = null;

  function checkPin(e) {
    const val = document.getElementById('pin-input').value;
    if (val.length === 4) {
      if (val === CORRECT_PIN) {
        sessionStorage.setItem(SESSION_KEY, '1');
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('app').classList.add('visible');
      } else {
        document.getElementById('pin-error').textContent = 'קוד שגוי';
        document.getElementById('pin-input').value = '';
        setTimeout(() => document.getElementById('pin-error').textContent = '', 2000);
      }
    }
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(tabName).classList.add('active');
  }

  function parsePaste() {
    const raw = document.getElementById('paste-input').value.trim();
    const card = document.getElementById('preview-card');
    const btn = document.getElementById('paste-btn');
    parsedData = null;
    card.classList.remove('show');
    btn.disabled = true;
    
    if (!raw) return;
    
    try {
      parsedData = JSON.parse(raw);
      document.getElementById('pc-title').textContent = parsedData.title || '—';
      document.getElementById('pc-cat').textContent = parsedData.category || '—';
      document.getElementById('pc-pri').textContent = parsedData.priority || '—';
      document.getElementById('pc-action').textContent = parsedData.action || 'addTask';
      card.classList.add('show');
      btn.disabled = false;
    } catch(e) {
      showToast('JSON לא תקין', 'error');
    }
  }

  async function submitPaste() {
    if (!parsedData) return;
    
    const btn = document.getElementById('paste-btn');
    btn.disabled = true;
    btn.textContent = 'שולח...';
    
    try {
      const payload = {
        ...parsedData,
        updatedDate: getDate(),
        week: getWeek()
      };
      
      const response = await fetch(DEFAULT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      
      const result = await response.json();
      
      if (result.success) {
        showToast('✓ משימה הוספה בהצלחה', 'success');
        document.getElementById('paste-input').value = '';
        document.getElementById('preview-card').classList.remove('show');
        parsedData = null;
      } else {
        showToast('שגיאה: ' + (result.error || 'לא ידוע'), 'error');
      }
    } catch(e) {
      showToast('שגיאת חיבור', 'error');
      console.error(e);
    }
    
    btn.disabled = false;
    btn.textContent = 'שלח לשיטס ✓';
  }

  async function submitAdd() {
    const title = document.getElementById('add-title').value.trim();
    if (!title) {
      showToast('חסרה כותרת משימה', 'error');
      return;
    }
    
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'שולח...';
    
    try {
      const payload = {
        action: 'addTask',
        title: title,
        category: document.getElementById('add-category').value,
        priority: document.getElementById('add-priority').value,
        notes: document.getElementById('add-notes').value,
        dueDate: document.getElementById('add-dueDate').value,
        status: 'פתוח',
        updatedDate: getDate(),
        week: getWeek()
      };
      
      const response = await fetch(DEFAULT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload)
      });
      
      const result = await response.json();
      
      if (result.success) {
        showToast('✓ משימה הוספה בהצלחה', 'success');
        document.getElementById('add-title').value = '';
        document.getElementById('add-notes').value = '';
        document.getElementById('add-dueDate').value = '';
        document.getElementById('add-priority').value = 'השבוע';
      } else {
        showToast('שגיאה: ' + (result.error || 'לא ידוע'), 'error');
      }
    } catch(e) {
      showToast('שגיאת חיבור', 'error');
      console.error(e);
    }
    
    btn.disabled = false;
    btn.textContent = 'הוסף לשיטס ✓';
  }

  function getDate() {
    return new Date().toLocaleDateString('he-IL', {day:'2-digit',month:'2-digit',year:'numeric'});
  }

  function getWeek() {
    const n = new Date(), s = new Date(n.getFullYear(), 0, 1);
    return 'שבוע ' + Math.ceil(((n - s) / 86400000 + s.getDay() + 1) / 7);
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  window.onload = () => {
    if (sessionStorage.getItem(SESSION_KEY)) {
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app').classList.add('visible');
    }
  };
</script>

</body>
</html>
